name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: npm-shrinkwrap.json
      - name: Install locked dependencies
        run: npm ci --ignore-scripts
      - name: Typecheck, tests, build and standalone verification
        run: npm run check
      - name: Verify committed runtime is current
        run: git diff --exit-code -- runtime
